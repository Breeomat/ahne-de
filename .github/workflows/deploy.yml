name: Veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # kurz nach Mitternacht (deutsche Zeit) neu bauen, damit das Drohnen-Logbuch (KI) jeden Tag neu geschrieben wird.
    # GitHub startet geplante Läufe oft Stunden später (bei stockhausen-online bis ~6 h) – früh angesetzt ist der
    # Eintrag trotzdem morgens da; das Datum nimmt das Skript in deutscher Zeit.
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Drohnen-Logbuch des Tages (scripts/logbuch.mjs); ohne Secret oder bei Fehlern wird es einfach übersprungen
      - name: Drohnen-Logbuch schreiben
        run: node scripts/logbuch.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
