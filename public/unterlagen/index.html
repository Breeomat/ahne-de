<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0c18">
<title>Unterlagen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Farben und Effekte wie www.ahne.de (Darstellung "modern") */
:root{--bg:#0a0c18;--karte:rgb(255 255 255 / .06);--karte-hover:rgb(255 255 255 / .09);--text:#eef0ff;--leise:#a9aecb;--linie:rgb(255 255 255 / .12);
  --gold:#f2d27a;--akzent:#e8c25a;--verlauf:linear-gradient(100deg,#b8862b,#f6e39b 30%,#d4a63a 50%,#fff0b8 70%,#b8862b);
  --warn:#ffb38a;--warn-bg:rgb(255 138 80 / .14);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.6 "Inter Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative;isolation:isolate;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20vmax;z-index:-2;pointer-events:none;
  background:radial-gradient(30vmax 30vmax at 20% 25%,rgb(124 245 214 / .35),transparent 70%),radial-gradient(35vmax 35vmax at 80% 20%,rgb(139 157 255 / .35),transparent 70%),radial-gradient(30vmax 30vmax at 60% 85%,rgb(255 138 216 / .3),transparent 70%);
  filter:blur(40px);animation:wolken 24s ease-in-out infinite alternate}
@keyframes wolken{0%{transform:translateZ(0) rotate(0) scale(1)}to{transform:translate3d(4vmax,-3vmax,0) rotate(25deg) scale(1.15)}}
@keyframes schimmern{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){*,body:before{animation:none!important;transition:none!important}}
.huelle{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:36px 0 14px}
h1{margin:0;font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;
  background:var(--verlauf);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:schimmern 10s linear infinite}
.stand{color:var(--leise);font-size:.9rem}
.glas{background:var(--karte);border:1px solid var(--linie);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#tor{max-width:400px;margin:14vh auto 0;border-radius:18px;padding:30px}
#tor h1{margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--linie);border-radius:12px;background:rgb(0 0 0 / .35);outline:none}
input:focus,select:focus{border-color:var(--akzent);box-shadow:0 0 0 3px rgb(232 194 90 / .2)}
select option{background:#14172a}
#tor button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:12px;background:var(--verlauf);background-size:200% 100%;color:#1a1405;font-weight:700;cursor:pointer;transition:background-position .6s}
#tor button:hover{background-position:100% 0}
.fehler{color:#ff9a9a;min-height:1.5em;margin:8px 0 0;font-size:.9rem}
.leiste{display:grid;grid-template-columns:1fr 160px 200px;gap:10px;margin:8px 0 14px}
.neu{background:rgb(124 245 214 / .16);color:#8ff5d8;border-radius:6px;padding:1px 8px;font-weight:600}
@media (max-width:640px){.leiste{grid-template-columns:1fr 1fr}.leiste input{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--linie);background:var(--karte);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer;transition:background .2s,border-color .2s}
.chip:hover{border-color:rgb(232 194 90 / .5)}
.chip[aria-pressed=true]{background:var(--verlauf);background-size:200% 100%;color:#1a1405;border-color:transparent;font-weight:600}
.liste{display:flex;flex-direction:column;gap:10px;padding-bottom:48px}
.dok{background:var(--karte);border:1px solid var(--linie);border-radius:16px;padding:15px 18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .2s,border-color .2s}
.dok:hover{background:var(--karte-hover);border-color:rgb(232 194 90 / .35)}
.kopf{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.titel{font-weight:650}
.titel a{color:var(--text);text-decoration:none}
.titel a:hover{background:var(--verlauf);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{color:var(--leise);font-size:.88rem}
.betrag{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--gold)}
.text{margin:6px 0 6px;color:#dfe2f5}
.fuss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--leise)}
.kat{background:rgb(242 210 122 / .14);color:var(--gold);border-radius:6px;padding:1px 8px;font-weight:600}
.hin{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 8px}
.leer{color:var(--leise);text-align:center;padding:40px 0}
.zahl{color:var(--leise);font-size:.9rem;margin-bottom:8px}
.aktionen{margin-left:auto;display:flex;gap:6px;align-items:center}
.knopf{border:1px solid var(--linie);background:transparent;border-radius:8px;padding:2px 10px;font-size:.8rem;cursor:pointer;color:var(--leise)}
.knopf:hover{color:var(--text);border-color:rgb(232 194 90 / .5)}
.knopf.rot:hover{color:#ff9a9a;border-color:rgb(255 120 120 / .6)}
.aktionen select{width:auto;padding:2px 8px;font-size:.8rem;border-radius:8px}
.vorgemerkt{background:rgb(139 157 255 / .18);color:#c3ccff;border-radius:6px;padding:1px 8px;font-weight:600}
.dok.markiert{opacity:.6}
.meldung{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1f36;border:1px solid var(--linie);border-radius:12px;padding:10px 16px;font-size:.9rem;z-index:5}
</style>
</head>
<body>
<div id="tor" class="glas">
  <h1>Unterlagen</h1>
  <p class="stand">Geschützter Bereich</p>
  <form id="login">
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
    <button type="submit" id="los">Öffnen</button>
    <p class="fehler" id="fehler"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="huelle">
    <h1>Unterlagen</h1>
    <div class="stand" id="stand"></div>
  </header>
  <main class="huelle">
    <div class="leiste">
      <input type="search" id="suche" placeholder="Suchen: Absender, Titel, Text, Betrag …">
      <select id="jahr"><option value="">Alle Jahre</option></select>
      <select id="sort"><option value="neu">Neueste</option><option value="alt">Älteste</option><option value="ein">Zuletzt eingegangen</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="zahl" id="zahl"></div>
    <div class="liste" id="liste"></div>
  </main>
</div>

<script>
const EINGEBETTET = /*EINGEBETTET*/null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATEN = null, aktKat = "", KEY = null, PAKET = null;
const OFFEN = {};  // id -> {aktion, kategorie, path, sha}: vorgemerkte Auftraege, die der PC noch nicht ausgefuehrt hat
const zuB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function entschluesseln(paket, pw) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  KEY = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(paket.salz), iterations:paket.runden, hash:"SHA-256"},
    basis, {name:"AES-GCM", length:256}, false, ["decrypt", "encrypt"]);
  const klar = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(paket.iv)}, KEY, b64(paket.daten));
  return JSON.parse(new TextDecoder().decode(klar));
}

// ---- Auftraege (Loeschen / Verschieben) ueber das private Repository; der PC fuehrt sie zur vollen/halben Stunde aus
async function gh(methode, pfad, body) {
  const a = DATEN.auftrag;
  const r = await fetch(`https://api.github.com/repos/${a.repo}/contents/${pfad}`, {method: methode,
    headers: {"Authorization": `Bearer ${a.token}`, "Accept": "application/vnd.github+json"},
    body: body ? JSON.stringify(body) : undefined, cache: "no-store"});
  if (r.status === 404 && methode === "GET") return null;
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.status === 204 ? null : r.json();
}
async function verschluesseln(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, KEY, new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, iv: zuB64(iv), daten: zuB64(ct)};
}
async function offeneLaden() {
  if (!DATEN.auftrag) return;
  try {
    const liste = await gh("GET", "auftraege") || [];
    for (const e of liste.filter(e => e.name.endsWith(".json"))) {
      const f = await gh("GET", e.path);
      const p = JSON.parse(atob(f.content.replace(/\n/g, "")));
      const a = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, KEY, b64(p.daten))));
      OFFEN[a.id] = {...a, path: e.path, sha: e.sha};
    }
    zeigen();
  } catch (e) { meldung("Vorgemerkte Aufträge konnten nicht geladen werden."); }
}
async function auftragAnlegen(id, aktion, kategorie) {
  const auftrag = {id, aktion, kategorie: kategorie || "", am: new Date().toISOString()};
  const pfad = `auftraege/${Date.now()}-${id}.json`;
  const inhalt = btoa(JSON.stringify(await verschluesseln(auftrag)));
  const r = await gh("PUT", pfad, {message: `${aktion} ${id}`, content: inhalt});
  OFFEN[id] = {...auftrag, path: pfad, sha: r.content.sha};
  zeigen();
  meldung(aktion === "loeschen" ? "Zum Löschen vorgemerkt – wird zur nächsten vollen/halben Stunde ausgeführt."
                                : `Verschieben nach „${kategorie}“ vorgemerkt.`);
}
async function auftragZuruecknehmen(id) {
  const o = OFFEN[id]; if (!o) return;
  await gh("DELETE", o.path, {message: `zurueck ${id}`, sha: o.sha});
  delete OFFEN[id];
  zeigen();
  meldung("Auftrag zurückgenommen.");
}
let meldungTimer;
function meldung(text) {
  let m = document.querySelector(".meldung");
  if (!m) { m = document.createElement("div"); m.className = "meldung"; document.body.append(m); }
  m.textContent = text; m.hidden = false;
  clearTimeout(meldungTimer); meldungTimer = setTimeout(() => m.hidden = true, 4000);
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-aktion]"); if (!b) return;
  const id = b.closest(".dok").dataset.id, dok = DATEN.dokumente.find(x => x.id === id);
  try {
    if (b.dataset.aktion === "loeschen") {
      if (confirm(`„${dok.titel || dok.alt}“ löschen?\n\nDie Datei kommt in den Papierkorb und verschwindet aus der Liste.`))
        await auftragAnlegen(id, "loeschen");
    } else if (b.dataset.aktion === "zurueck") await auftragZuruecknehmen(id);
  } catch (err) { meldung("Fehler: " + err.message); }
});
document.addEventListener("change", async e => {
  const s = e.target.closest("select[data-aktion=verschieben]"); if (!s || !s.value) return;
  const id = s.closest(".dok").dataset.id;
  try { await auftragAnlegen(id, "verschieben", s.value); } catch (err) { meldung("Fehler: " + err.message); s.value = ""; }
});

document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const f = document.getElementById("fehler"), btn = document.getElementById("los");
  f.textContent = ""; btn.disabled = true; btn.textContent = "Entschlüssele …";
  try {
    const paket = EINGEBETTET || await (await fetch("daten.enc.json", {cache:"no-store"})).json();
    DATEN = await entschluesseln(paket, document.getElementById("pw").value);
    document.getElementById("pw").value = "";
    start();
  } catch (err) {
    f.textContent = "Passwort falsch oder Daten nicht ladbar.";
  } finally { btn.disabled = false; btn.textContent = "Öffnen"; }
});

function start() {
  document.getElementById("tor").hidden = true;
  document.getElementById("app").hidden = false;
  const d = DATEN.dokumente;
  document.getElementById("stand").textContent = `${d.length} Dokumente · Stand ${DATEN.stand}`;
  const jahre = [...new Set(d.map(x => x.datum.slice(0,4)))].sort().reverse();
  document.getElementById("jahr").insertAdjacentHTML("beforeend", jahre.map(j => `<option>${j}</option>`).join(""));
  const zaehl = {}; d.forEach(x => zaehl[x.kat] = (zaehl[x.kat]||0)+1);
  const kats = Object.keys(zaehl).sort((a,b) => zaehl[b]-zaehl[a]);
  const chips = document.getElementById("chips");
  chips.innerHTML = `<button class="chip" aria-pressed="true" data-k="">Alle</button>` +
    kats.map(k => `<button class="chip" aria-pressed="false" data-k="${esc(k)}">${esc(k)} · ${zaehl[k]}</button>`).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    aktKat = b.dataset.k;
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    zeigen();
  });
  try { const s = localStorage.getItem("unterlagen-sort"); if (s) document.getElementById("sort").value = s; } catch (e) {}
  ["suche","jahr","sort"].forEach(id => document.getElementById(id).addEventListener("input", zeigen));
  zeigen();
  offeneLaden();
}

function aktionen(x) {
  if (!DATEN.auftrag) return "";
  const o = OFFEN[x.id];
  if (o) return `<span class="aktionen"><span class="vorgemerkt">vorgemerkt: ${o.aktion === "loeschen" ? "Löschen" : "→ " + esc(o.kategorie)}</span>
    <button class="knopf" data-aktion="zurueck">Rückgängig</button></span>`;
  const ziele = DATEN.kategorien.filter(k => k !== x.kat);
  return `<span class="aktionen">
    <select data-aktion="verschieben" aria-label="Verschieben nach"><option value="">Verschieben …</option>${ziele.map(k => `<option>${esc(k)}</option>`).join("")}</select>
    <button class="knopf rot" data-aktion="loeschen">Löschen</button></span>`;
}

function zeigen() {
  const q = document.getElementById("suche").value.toLowerCase().split(/\s+/).filter(Boolean);
  const jahr = document.getElementById("jahr").value;
  let d = DATEN.dokumente.filter(x =>
    (!aktKat || x.kat === aktKat) && (!jahr || x.datum.startsWith(jahr)) &&
    q.every(w => [x.absender, x.titel, x.text, x.betrag, x.kat, x.alt, x.datei, ...(x.tags||[])].join(" ").toLowerCase().includes(w)));
  const sort = document.getElementById("sort").value;
  try { localStorage.setItem("unterlagen-sort", sort); } catch (e) {}
  if (sort === "alt") d = [...d].reverse();
  if (sort === "ein") d = [...d].sort((a, b) => (b.ein || "").localeCompare(a.ein || "") || b.datum.localeCompare(a.datum));
  document.getElementById("zahl").textContent = `${d.length} Treffer`;
  const datum = s => s ? s.split("-").reverse().join(".") : "";
  const eingang = s => s ? new Date(s).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
  const frisch = s => s && (Date.now() - new Date(s)) < 7 * 864e5;
  document.getElementById("liste").innerHTML = d.length ? d.map(x => `
    <article class="dok${OFFEN[x.id] ? " markiert" : ""}" data-id="${esc(x.id)}">
      <div class="kopf">
        <div>
          <div class="titel"><a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.titel || x.alt)}</a></div>
          <div class="meta">${esc(datum(x.datum))}${x.absender ? " · " + esc(x.absender) : ""}${sort === "ein" && x.ein ? " · eingegangen " + esc(eingang(x.ein)) : ""}</div>
        </div>
        ${x.betrag ? `<div class="betrag">${esc(x.betrag)}</div>` : ""}
      </div>
      <p class="text">${esc(x.text)}</p>
      <div class="fuss">${frisch(x.ein) ? `<span class="neu">neu</span>` : ""}<span class="kat">${esc(x.kat)}</span>
        ${(x.hinweise||[]).map(h => `<span class="hin">${esc(h)}</span>`).join("")}
        <span title="Ursprünglicher Dateiname">${esc(x.alt)}</span>${aktionen(x)}</div>
    </article>`).join("") : `<div class="leer">Keine Dokumente gefunden.</div>`;
}
</script>
</body>
</html>
