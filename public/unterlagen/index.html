<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2f4a3a">
<title>Unterlagen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f4ef;--karte:#fff;--text:#1f2a24;--leise:#5d6b63;--linie:#dcd8cf;--akzent:#2f4a3a;--akzent-hell:#e3ebe5;--warn:#8a5a00;--warn-bg:#fbf0d9}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--karte:#1c2420;--text:#e6ebe8;--leise:#9aa8a0;--linie:#2e3a34;--akzent:#8fc0a0;--akzent-hell:#22322a;--warn:#f0c36a;--warn-bg:#3a2f17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.huelle{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:28px 0 12px}
h1{margin:0;font-size:1.6rem;color:var(--akzent)}
.stand{color:var(--leise);font-size:.9rem}
#tor{max-width:380px;margin:12vh auto;background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:28px}
#tor h1{margin-bottom:6px}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--linie);border-radius:10px;background:var(--bg)}
#tor button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:10px;background:var(--akzent);color:var(--karte);font-weight:600;cursor:pointer}
.fehler{color:#b3261e;min-height:1.5em;margin:8px 0 0;font-size:.9rem}
.leiste{display:grid;grid-template-columns:1fr 200px 120px;gap:10px;margin:8px 0 14px}
@media (max-width:640px){.leiste{grid-template-columns:1fr 1fr}.leiste input{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--linie);background:var(--karte);border-radius:999px;padding:3px 11px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--akzent);color:var(--karte);border-color:var(--akzent)}
.liste{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.dok{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:14px 16px}
.kopf{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.titel{font-weight:650}
.titel a{color:inherit;text-decoration:none}
.titel a:hover{text-decoration:underline}
.meta{color:var(--leise);font-size:.88rem}
.betrag{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.text{margin:6px 0 4px}
.fuss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--leise)}
.kat{background:var(--akzent-hell);color:var(--akzent);border-radius:6px;padding:1px 8px;font-weight:600}
.hin{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 8px}
.leer{color:var(--leise);text-align:center;padding:40px 0}
.zahl{color:var(--leise);font-size:.9rem;margin-bottom:8px}
</style>
</head>
<body>
<div id="tor">
  <h1>Unterlagen</h1>
  <p class="stand">Geschützter Bereich</p>
  <form id="login">
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
    <button type="submit" id="los">Öffnen</button>
    <p class="fehler" id="fehler"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="huelle">
    <h1>Unterlagen</h1>
    <div class="stand" id="stand"></div>
  </header>
  <main class="huelle">
    <div class="leiste">
      <input type="search" id="suche" placeholder="Suchen: Absender, Titel, Text, Betrag …">
      <select id="jahr"><option value="">Alle Jahre</option></select>
      <select id="sort"><option value="neu">Neueste</option><option value="alt">Älteste</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="zahl" id="zahl"></div>
    <div class="liste" id="liste"></div>
  </main>
</div>

<script>
const EINGEBETTET = /*EINGEBETTET*/null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATEN = null, aktKat = "";

async function entschluesseln(paket, pw) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(paket.salz), iterations:paket.runden, hash:"SHA-256"},
    basis, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const klar = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(paket.iv)}, key, b64(paket.daten));
  return JSON.parse(new TextDecoder().decode(klar));
}

document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const f = document.getElementById("fehler"), btn = document.getElementById("los");
  f.textContent = ""; btn.disabled = true; btn.textContent = "Entschlüssele …";
  try {
    const paket = EINGEBETTET || await (await fetch("daten.enc.json", {cache:"no-store"})).json();
    DATEN = await entschluesseln(paket, document.getElementById("pw").value);
    document.getElementById("pw").value = "";
    start();
  } catch (err) {
    f.textContent = "Passwort falsch oder Daten nicht ladbar.";
  } finally { btn.disabled = false; btn.textContent = "Öffnen"; }
});

function start() {
  document.getElementById("tor").hidden = true;
  document.getElementById("app").hidden = false;
  const d = DATEN.dokumente;
  document.getElementById("stand").textContent = `${d.length} Dokumente · Stand ${DATEN.stand}`;
  const jahre = [...new Set(d.map(x => x.datum.slice(0,4)))].sort().reverse();
  document.getElementById("jahr").insertAdjacentHTML("beforeend", jahre.map(j => `<option>${j}</option>`).join(""));
  const zaehl = {}; d.forEach(x => zaehl[x.kat] = (zaehl[x.kat]||0)+1);
  const kats = Object.keys(zaehl).sort((a,b) => zaehl[b]-zaehl[a]);
  const chips = document.getElementById("chips");
  chips.innerHTML = `<button class="chip" aria-pressed="true" data-k="">Alle</button>` +
    kats.map(k => `<button class="chip" aria-pressed="false" data-k="${esc(k)}">${esc(k)} · ${zaehl[k]}</button>`).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    aktKat = b.dataset.k;
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    zeigen();
  });
  ["suche","jahr","sort"].forEach(id => document.getElementById(id).addEventListener("input", zeigen));
  zeigen();
}

function zeigen() {
  const q = document.getElementById("suche").value.toLowerCase().split(/\s+/).filter(Boolean);
  const jahr = document.getElementById("jahr").value;
  let d = DATEN.dokumente.filter(x =>
    (!aktKat || x.kat === aktKat) && (!jahr || x.datum.startsWith(jahr)) &&
    q.every(w => [x.absender, x.titel, x.text, x.betrag, x.kat, x.alt, x.datei, ...(x.tags||[])].join(" ").toLowerCase().includes(w)));
  if (document.getElementById("sort").value === "alt") d = [...d].reverse();
  document.getElementById("zahl").textContent = `${d.length} Treffer`;
  const datum = s => s ? s.split("-").reverse().join(".") : "";
  document.getElementById("liste").innerHTML = d.length ? d.map(x => `
    <article class="dok">
      <div class="kopf">
        <div>
          <div class="titel"><a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.titel || x.alt)}</a></div>
          <div class="meta">${esc(datum(x.datum))}${x.absender ? " · " + esc(x.absender) : ""}</div>
        </div>
        ${x.betrag ? `<div class="betrag">${esc(x.betrag)}</div>` : ""}
      </div>
      <p class="text">${esc(x.text)}</p>
      <div class="fuss"><span class="kat">${esc(x.kat)}</span>
        ${(x.hinweise||[]).map(h => `<span class="hin">${esc(h)}</span>`).join("")}
        <span title="Ursprünglicher Dateiname">${esc(x.alt)}</span></div>
    </article>`).join("") : `<div class="leer">Keine Dokumente gefunden.</div>`;
}
</script>
</body>
</html>
