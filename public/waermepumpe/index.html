    if(sp.length)o+='<p class="m">Spreizung VL-RL bei laufendem Verdichter: Ø '+f1(sp.reduce(function(p,q){return p+q},0)/sp.length)+" K, max "+f1(Math.max.apply(null,sp))+" K</p>";
    o+="<h3>Betrieb</h3><div class='tw'><table><tr><th></th><th>Anteil</th><th>Dauer</th></tr>";
    BN.forEach(function(k){var s=0;rs.forEach(function(r,i){if(flag(r,k))s+=step(rs,i)});o+="<tr><td>"+BNAME[k]+"</td><td>"+f1(tot?s/tot*100:0)+" %</td><td>"+std(s/3600)+"</td></tr>"});
    var md={};rs.forEach(function(r,i){var m=modus(r,P)||"?";md[m]=(md[m]||0)+step(rs,i)});
    o+="</table></div><p class='m'>Betriebsarten: "+Object.keys(md).sort(function(p,q){return md[q]-md[p]}).map(function(m){return m+" "+std(md[m]/3600)}).join(", ")+"</p>";
    var la=phasen(rs,function(r){return flag(r,"vd")});
    if(la.length){var dd=la.map(function(p){return(p[1]-p[0])/60}),kurz=dd.filter(function(d){return d<10}).length;
      o+="<h3>Verdichterlaeufe ("+la.length+", Ø "+f1(dd.reduce(function(p,q){return p+q},0)/dd.length,0)+" min, kuerzester "+f1(Math.min.apply(null,dd),0)+", laengster "+f1(Math.max.apply(null,dd),0)+" min, kurze unter 10 min: "+kurz+")</h3><div class='tw' style='max-height:320px;overflow:auto'><table><tr><th>Start</th><th>Ende</th><th>Minuten</th><th>Betriebsart</th></tr>";
      la.forEach(function(p){var c={};rs.forEach(function(r){if(r[0]>=p[0]&&r[0]<=p[1]){var m=modus(r,P);c[m]=(c[m]||0)+1}});var mm=Object.keys(c).sort(function(u,v){return c[v]-c[u]})[0]||"";
        o+="<tr><td>"+dmhm(p[0])+"</td><td>"+hm(p[1])+"</td><td>"+f1((p[1]-p[0])/60,0)+"</td><td>"+mm+"</td></tr>"});
      o+="</table></div>"}else o+="<h3>Verdichterlaeufe</h3><p class='m'>keine</p>";
    var ab=phasen(rs,function(r){return flag(r,"av")});
    if(ab.length){o+="<h3>Abtauungen ("+ab.length+", Ø "+f1(ab.reduce(function(s,p){return s+(p[1]-p[0])/60},0)/ab.length)+" min)</h3><div class='tw' style='max-height:240px;overflow:auto'><table><tr><th>Start</th><th>Minuten</th></tr>"+ab.map(function(p){return"<tr><td>"+dmhm(p[0])+"</td><td>"+f1((p[1]-p[0])/60)+"</td></tr>"}).join("")+"</table></div>"}
    else o+="<h3>Abtauungen</h3><p class='m'>keine</p>";
    var hz=counter(rs,col("wmz_hz")),bw=counter(rs,col("wmz_bw")),bh=counter(rs,col("betr_h")),st=counter(rs,col("starts"));
    gesamtKwh+=(hz||0)+(bw||0);
    o+="<h3>Zaehler im Zeitraum</h3><p class='m'>Waermemenge Heizung "+f1(hz)+" kWh, Warmwasser "+f1(bw)+" kWh. Betriebsstunden Verdichter "+f1(bh)+" h, Starts "+f1(st,0)+".</p>";
    var tage={};rs.forEach(function(r){var d=dt(r[0]),k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();(tage[k]=tage[k]||[]).push(r)});
    var ks=Object.keys(tage);
    if(ks.length>1){o+="<h3>Je Tag</h3><div class='tw'><table><tr><th>Tag</th><th>Verdichter [h]</th><th>Heizung kWh</th><th>Warmwasser kWh</th><th>Ø Aussen °C</th><th>Abtauungen</th></tr>";
      ks.forEach(function(k){var t=tage[k],v=0,au=[];t.forEach(function(r,i){if(flag(r,"vd"))v+=step(t,i);if(r[col("aussen")]!=null)au.push(r[col("aussen")])});
        var n=phasen(t,function(r){return flag(r,"av")}).length;
        o+="<tr><td>"+dt(t[0][0]).toLocaleDateString("de-DE")+"</td><td>"+f1(v/3600)+"</td><td>"+f1(counter(t,col("wmz_hz")))+"</td><td>"+f1(counter(t,col("wmz_bw")))+"</td><td>"+f1(au.length?au.reduce(function(p,q){return p+q},0)/au.length:null)+"</td><td>"+n+"</td></tr>"});
      o+="</table></div>"}
    o+="</section>"});
  o+="<section><p class='m'>Waermemenge beider Pumpen im Zeitraum: <b>"+f1(gesamtKwh)+" kWh</b>. Stromverbrauch und COP stehen nicht in den Logs.</p></section>";
  $("pumpen").innerHTML=o}
function setBar(v){BAR=v;$("b10").className=v==10?"on":"";$("b25").className=v==25?"on":"";render()}
$("b10").onclick=function(){setBar(10)};$("b25").onclick=function(){setBar(25)};
$("go").onclick=function(){var a=$("von").value,b=$("bis").value;
  if(!a||!b){$("err").textContent=" Bitte Beginn und Ende waehlen.";return}
  var t0=new Date(a).getTime()/1000,t1=new Date(b).getTime()/1000;
  if(!(t1>t0)){$("err").textContent=" Das Ende muss nach dem Beginn liegen.";return}
  $("err").textContent="";SEL=-1;WIN=[t0,t1];render()};
$("info").textContent=DATA.info;
render();
</script></body></html>
