        return`<tr>${td(z.label+(z.teilweise?' <span style="color:var(--mut)" title="Zeitraum unvollständig">*</span>':""))}${td(isFinite(mn)?f1(mn)+" – "+f1(mx):"–",1)}${td(sum(z,"h",0),1)}${td(hm(sum(z,"h",1)),1)}${td(sum(z,"w",0),1)}${td(hm(sum(z,"w",1)),1)}${td(sum(z,"a",0),1)}${td(f0(sum(z,"a",1)/60),1)}${td(sv?f0(sv.s):"–",1)}${td(cop,1)}${td(z.hgt>0?f1(z.hgt):"–",1)}${td(sv&&z.hgt>=1?(sv.s/z.hgt).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}):"–",1)}</tr>`}).join("")}</table></div>
      <div class="read">* Zeitraum unvollständig (heute, erste Aufzeichnung oder fehlende Tage). Ein Heiz- oder Warmwasser-Vorgang ist ein zusammenhängender Verdichterlauf in dieser Betriebsart; Pausen bis 5 Minuten und Abtauungen (bis 30 Minuten Pause) unterbrechen ihn nicht. Die Dauer des Heizvorgangs enthält darum die Abtauzeiten. Abtau-Abschnitte unter 5 Minuten Abstand zählen als eine Abtauung. Strom und COP aus den Zählerständen (Heizstab nicht enthalten). Heizgradtage (G20/15): je Tag Raum 20 °C minus Tagesmittel der Außentemperatur, nur an Tagen unter 15 °C Mittel, dann summiert. kWh je HGT = Strom geteilt durch Heizgradtage, also der Stromverbrauch bereinigt um das Wetter; die Warmwasser-Bereitung steckt mit drin und fällt bei wenigen Heizgradtagen stark ins Gewicht, darum zählen erst ab 1 Heizgradtag Werte.${ZA.p=="Beide"?" „Beide Pumpen“ addiert Anzahl und Dauer beider Verdichter.":""}</div>`}
    body=`<div class="ctl" style="margin-top:10px">${bt}</div><div class="ctl">${pt}</div>${tab}${ZA.fehler?`<div class="err">${ZA.fehler}</div>`:""}`}
  el.innerHTML=`<div class="card" style="margin-bottom:16px"><details ${OFFEN.has("zahl")?"open":""} ontoggle="if(this.open){OFFEN.add('zahl');if(!ZA.data||Date.now()-ZA.t>30000)ladeZahl()}else{OFFEN.delete('zahl')}"><summary style="cursor:pointer;list-style-position:inside"><b>Auswertung je Tag, Woche, Monat</b> <span style="color:var(--mut)">Heizen, Warmwasser, Abtauen, Strom</span></summary>${body}</details></div>`}
async function ladeZahl(){if(!OFFEN.has("zahl"))return;const st=ZA.st;try{const d=await (await fetch("/api/zahlen?stufe="+st)).json();if(st==ZA.st){ZA.data=d;ZA.fehler=d.fehler||null;ZA.t=Date.now();zahlDraw()}}catch(e){ZA.fehler="Auswertung konnte nicht geladen werden."}}
let S=null;
function strom(){if(!S||!S.aktiv||!S.punkte)return"";
  const zr=S.zeitraeume||{},namen=["Master","Slave","Gesamt"],lab={Master:"Pumpe 1",Slave:"Pumpe 2",Gesamt:"Beide"};
  const zelle=v=>v&&v.cop!=null?`<b>${v.cop.toLocaleString("de-DE",{minimumFractionDigits:2})}</b><br><small class="kwh" style="color:var(--mut);white-space:nowrap">${v.wm.toLocaleString("de-DE",{maximumFractionDigits:0})} / ${v.strom.toLocaleString("de-DE",{maximumFractionDigits:0})} kWh</small>`:'<span style="color:var(--mut)">–</span>';
  const ks=Object.keys(zr);
  const g24=zr["24 h"]&&zr["24 h"].Gesamt,cop24=g24&&g24.cop!=null?g24.cop.toLocaleString("de-DE",{minimumFractionDigits:2})+" (beide)":"";
  const vonS=Object.values(zr["seit Beginn"]||{}).filter(v=>v&&v.von).map(v=>v.von).sort()[0];
  const vonD=vonS?vonS.slice(8,10)+"."+vonS.slice(5,7)+"."+vonS.slice(0,4):"",vonT=vonS?vonS.slice(11,16):"";
  const kh=k=>k=="seit Beginn"&&vonD?`seit ${vonD.slice(0,6)+vonD.slice(8)}`:k;
  let t=`<table class="st" style="width:100%;border-collapse:collapse;font-size:14px"><tr><th></th>${ks.map(k=>`<th style="text-align:right;color:var(--mut);font-weight:400">${kh(k)}</th>`).join("")}</tr>`
   +namen.map(n=>`<tr style="border-top:1px solid var(--line)"><td style="padding:6px 0">${lab[n]}</td>${ks.map(k=>`<td style="text-align:right;padding:6px 0">${zelle(zr[k][n])}</td>`).join("")}</tr>`).join("")+"</table>";
  const kw=v=>v&&v.strom!=null?`<b>${v.strom.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1})}</b>`:'<span style="color:var(--mut)">–</span>';
  t+=`<div style="margin-top:14px;font-weight:600;font-size:14px">Stromverbrauch [kWh]</div><table class="st" style="width:100%;border-collapse:collapse;font-size:14px"><tr><th></th>${ks.map(k=>`<th style="text-align:right;color:var(--mut);font-weight:400">${kh(k)}</th>`).join("")}</tr>`
   +namen.map(n=>`<tr style="border-top:1px solid var(--line)"><td style="padding:6px 0">${lab[n]}</td>${ks.map(k=>`<td style="text-align:right;padding:6px 0">${kw(zr[k][n])}</td>`).join("")}</tr>`).join("")+"</table>";
  const l=S.letzte||{},zaehler=Object.entries(l).map(([n,z])=>`<div class="kpi"><small>${lab[n]||n}: Wärme / Strom gesamt</small><span style="font-size:18px">${(z.wm_gesamt||0).toLocaleString("de-DE",{maximumFractionDigits:0})} / ${(z.strom_gesamt||0).toLocaleString("de-DE",{maximumFractionDigits:0})}</span> <i>kWh</i>${z.heizstab_strom!=null?`<br><small style="color:var(--mut)">davon Heizstab ${z.heizstab_strom.toLocaleString("de-DE",{maximumFractionDigits:1})} kWh Strom</small>`:""}</div>`).join("");
  const tg=S.tage||[];let bars="";
  if(tg.length>1){const W=640,H=140,L=34,B=20,T=8,mx=Math.max(5,Math.ceil(Math.max(...tg.map(d=>d.cop||0))+0.5)),bw=(W-L-8)/tg.length;
    bars=`<svg class="cop" viewBox="0 0 ${W} ${H}" style="margin-top:8px">`;
    for(let a=0;a<=mx;a++)bars+=`<line x1="${L}" x2="${W-8}" y1="${T+(1-a/mx)*(H-T-B)}" y2="${T+(1-a/mx)*(H-T-B)}" stroke="${css("--line")}"/><text x="${L-5}" y="${T+(1-a/mx)*(H-T-B)+4}" text-anchor="end" font-size="11" fill="${css("--mut")}">${a}</text>`;
    tg.forEach((d,i)=>{const h=(d.cop||0)/mx*(H-T-B),x=L+i*bw+bw*.15;bars+=`<rect x="${x}" y="${H-B-h}" width="${bw*.7}" height="${h}" fill="${css("--hz")}" opacity="${d.teilweise?.4:.85}"><title>${d.tag}: COP ${d.cop} · ${d.wm} kWh Wärme · ${d.strom} kWh Strom${d.teilweise?" (Teiltag)":""}</title></rect><text x="${x+bw*.35}" y="${H-5}" text-anchor="middle" font-size="10" fill="${css("--mut")}">${d.tag.slice(8)}.${d.tag.slice(5,7)}.</text>`});
    bars+="</svg>"}
  return `<div class="card" style="margin-bottom:16px"><details ${OFFEN.has("strom")?"open":""} ontoggle="this.open?(OFFEN.add('strom'),load()):OFFEN.delete('strom')"><summary style="cursor:pointer;list-style-position:inside"><span class="head" style="display:inline-flex;width:calc(100% - 22px);margin-bottom:0;vertical-align:middle"><span><b>Strom &amp; COP</b> <span style="color:var(--mut)">${cop24?"· COP 24 h: "+cop24:"· beide Pumpen"}</span></span><span class="badge">${S.stand?"Stand "+new Date(S.stand*1000).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"nur Verlaufsdatei"}</span></span></summary><div style="max-width:760px;margin-top:12px">
  ${t}<div class="kpis sm" style="margin-top:10px">${zaehler}</div>
  ${svBlock()}
  <div class="read">${vonD?`Aufzeichnung seit ${vonD}, ${vonT} Uhr. `:""}Schnitt über den Zeitraum = Wärmemenge ÷ Strom aus den Zählerständen (ohne Heizstab). Zeitraum = ${S.punkte} Messpunkte, Abfrage alle ${S.intervall} Min.</div>
  ${S.fehler?`<div class="err">Strom-Abfrage: ${S.fehler}</div>`:""}</div></details></div>`}
const MFAN='<svg viewBox="0 0 200 170" aria-hidden="true"><rect x="18" y="146" width="164" height="10" rx="3" fill="#2a2f3f"/><rect x="10" y="12" width="180" height="136" rx="12" fill="#1c2130" stroke="rgb(242 210 122 / .45)" stroke-width="3"/><circle class="mfan__schein" cx="100" cy="82" r="58" fill="currentColor"/><circle cx="100" cy="82" r="52" fill="#0d1018" stroke="#3a4155" stroke-width="4"/><g class="mfan__rotor"><g fill="#c9cfdf"><path d="M100 82 C 96 60, 104 40, 118 34 C 122 50, 114 70, 100 82Z"/><path d="M100 82 C 96 60, 104 40, 118 34 C 122 50, 114 70, 100 82Z" transform="rotate(120 100 82)"/><path d="M100 82 C 96 60, 104 40, 118 34 C 122 50, 114 70, 100 82Z" transform="rotate(240 100 82)"/></g><circle cx="100" cy="82" r="9" fill="#f2d27a"/></g><g stroke="#3a4155" stroke-width="2"><line x1="48" y1="82" x2="152" y2="82"/><line x1="100" y1="30" x2="100" y2="134"/><circle cx="100" cy="82" r="36" fill="none"/><circle cx="100" cy="82" r="20" fill="none"/></g></svg>';
function modusArt(m){m=(m||"").toLowerCase();if(/abtau|defrost/.test(m))return["Abtauen","#e8f3ff"];if(/warm|hot/.test(m))return["Warmwasser","#4dabf7"];if(/heiz|heat/.test(m))return["Heizen","#ff922b"];return["Bereit","#f2d27a"]}
function fanBox(l){const an=!!l.vd,a=modusArt(l.modus),pause=!an&&/heat|heiz|warm|hot/i.test(l.modus||"");
  return`<span class="mfan ${an?"an":""}" style="--mc:${a[1]};color:${a[1]}" title="${l.modus||"–"}">${MFAN}<span class="mfan__t"><b>${an?a[0]:pause?a[0]+" · Pause":l.modus?"Aus":"–"}</b><small>${an?"Verdichter läuft":"Verdichter aus"}</small></span></span>`}
function draw(){if(!D)return;let h="";let i=0;document.getElementById("stromk").innerHTML=strom();document.getElementById("kurz").innerHTML=kurz();
  for(const[n,p]of Object.entries(D.pumpen)){const l=p.letzte||{};
    const dt=l.vl!=null&&l.rl!=null?l.vl-l.rl:null;
    const ser=SERIEN.filter(s=>p.zeige.serien.includes(s[0]));
    h+=`<div class="card"><div class="head"><div><b>${n}</b> <span style="color:var(--mut)">${p.rolle}</span></div>${fanBox(l)}</div>
    <div class="kpis">${p.zeige.kacheln.map(k=>kpi(KACHELN[k][0],k=="spreizung"?dt:k=="d_rl"?dif(l.rl_ext,l.rl_soll):k=="d_ww"?dif(l.ww,l.ww_soll):l[k],KACHELN[k][1],1,k[0]=="d"&&k[1]=="_")).join("")}${n=="Master"?zimmerKacheln():""}</div>
    ${chart(p.verlauf,i,ser,{bars:balken(n,p),h:440,extra:shellyLinien()})}
    <div class="leg">${ser.map(([,a,c])=>`<span><em style="background:var(${c})"></em>${a}</span>`).join("")}${shellyLegende()}${balkenLegende(n)}</div>
    ${n=="Master"?`<div style="margin-top:12px;font-weight:600;font-size:14px">Heizung</div>${chart(p.verlauf,"h"+i,[["rl_ext","Rücklauf extern","--rx"],["rl_soll","Rücklauf Soll","--rs"],["aussen","Außen","--au"]],{bars:balken(n,p),lines:hupLinien(),h:440,smooth:1,extra:shellyLinien()})}
    <div class="leg"><span><em style="background:var(--au)"></em>Außentemperatur</span>${shellyLegende()}<span><em style="background:var(--rx)"></em>Rücklauf extern</span><span><em style="background:var(--rs)"></em>Rücklauf Soll (gestrichelt)</span>${balkenLegende(n)}<span><em style="background:var(--hz)"></em>Heizungspumpe (Linie 0 aus / 10 ein)</span></div>`:""}
    ${p.zeige.serien.includes("ww")?`<div style="margin-top:12px;font-weight:600;font-size:14px">Warmwasser</div>${chart(p.verlauf,"w"+i,[["ww","Warmwasser Ist","--ww"]],{bar:{fn:isWw,c:"--wb"},lines:[{fn:q=>!!q.zip,c:"--h2"}],h:440,smooth:1,extra:shellyLinien()})}
    <div class="leg"><span><em style="background:var(--ww)"></em>Warmwasser Ist</span>${shellyLegende()}<span><em style="background:var(--wb)"></em>Warmwasserbereitung läuft (Balken bis ${BAR})</span><span><em style="background:var(--h2)"></em>Zirkulation WW, ZIP (Linie 0 aus / 10 ein)</span></div>`:""}
    ${details(p,l,n)}
    ${p.fehler?`<div class="err">Abfrage fehlgeschlagen: ${p.fehler}</div>`:""}${lfTab(n)}${fsTab(n)}${alle(n)}</div>`;i++}
  document.getElementById("grid").innerHTML=h;
  i=0;for(const [n,p] of Object.entries(D.pumpen)){const idx=i++;
    const dz=(k,x,y,lab)=>b=>b[x]!=null&&b[y]!=null?" · "+lab+" "+fmtK(b[x]-b[y]):"";
    const kd=b=>[["d_rl","rl_ext","rl_soll"],["d_ww","ww","ww_soll"]].filter(([k,x,y])=>p.zeige.kacheln.includes(k)&&b[x]!=null&&b[y]!=null).map(([k,x,y])=>" · "+KACHELN[k][0]+" "+fmtK(b[x]-b[y])).join("");
    const zust=b=>" · Verdichter "+(b.vd?"an":"aus")+(b.modus&&b.modus!="no request"?" ("+modusArt(b.modus)[0]+")":"");
    const mitSerien=keys=>b=>SERIEN.filter(s=>keys.includes(s[0])).map(([k,a])=>a+" "+f(b[k])).join(" · ");
    hoverAn("c_"+idx,"cur_"+idx,"r_"+idx,p,b=>mitSerien(p.zeige.serien)(b)+kd(b)+zimmerAt(b.t)+zust(b));
    hoverAn("c_h"+idx,"cur_h"+idx,"r_h"+idx,p,b=>[["Rücklauf extern",b.rl_ext],["Rücklauf Soll",b.rl_soll],["Außen",b.aussen]].filter(x=>x[1]!=null).map(x=>x[0]+" "+f(x[1])).join(" · ")+kd(b)+zimmerAt(b.t)+" · Heizungspumpe "+(b.hup?"ein":"aus")+zust(b));
    hoverAn("c_w"+idx,"cur_w"+idx,"r_w"+idx,p,b=>[["Warmwasser Ist",b.ww],["Warmwasser Soll",b.ww_soll],["Außen",b.aussen]].filter(x=>x[1]!=null).map(x=>x[0]+" "+f(x[1])).join(" · ")+kd(b)+zimmerAt(b.t)+" · Zirkulation "+(b.zip?"ein":"aus")+(isWw(b)?" · Warmwasserbereitung läuft":"")+zust(b))}}
function fmtK(x){return x.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1,signDisplay:"exceptZero"}).replace("-","−")+" K"}
function zimmerAt(t){const S=D&&D.shelly||{};return Object.entries(S).map(([nm,P])=>{let q=null;P.forEach(x=>{if(x[0]<=t)q=x});if(!q)q=P[0];if(!q)return"";return" · "+(/^SHELLY/i.test(nm)?"Zimmer":"Zimmer "+nm)+" "+f(q[1])}).join("")}
function hoverAn(svgId,curId,rId,p,text){const svg=document.getElementById(svgId);if(!svg)return;
  svg.classList.add("ch");svg.onpointermove=svg.onpointerdown=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*640,t0=+svg.dataset.t0,t1=+svg.dataset.t1,t=t0+(px-40)/(640-48)*(t1-t0);
    const pts=p.verlauf.filter(q=>q.t>=t0);if(!pts.length)return;let b=pts[0];pts.forEach(q=>{if(Math.abs(q.t-t)<Math.abs(b.t-t))b=q});
    const c=document.getElementById(curId),xx=40+(b.t-t0)/(t1-t0)*(640-48);c.setAttribute("x1",xx);c.setAttribute("x2",xx);c.setAttribute("opacity","1");
    document.getElementById(rId).textContent=new Date(b.t*1000).toLocaleTimeString("de-DE")+" · "+text(b).replace(/^ · /,"")}}
async function load(){try{WIN=fenster();const r=await fetch("/api?von="+Math.floor(WIN[0])+"&bis="+Math.ceil(WIN[1]));D=await r.json();if(D.von&&!RANGE)WIN[0]=Math.max(WIN[0],D.von);try{A=await (await fetch("/api/alle")).json()}catch(e){}try{S=await (await fetch("/api/strom")).json()}catch(e){}try{LF=await (await fetch("/api/laeufe")).json()}catch(e){}if(OFFEN.has("strom")){try{SV=await (await fetch("/api/stromverlauf?tage="+SVT)).json()}catch(e){}}
  document.getElementById("sub").textContent="Daten bis 18.11.2026, 24:00 Uhr \u00b7 wird jede Nacht aktualisiert (keine Live-Werte)"+(D.demo?" · DEMO-DATEN":"")+" · Version 15.11. 22:30 (kWh je Heizgradtag)"+(D.handy?" · Handy: "+D.handy:"");draw()}
  catch(e){document.getElementById("sub").textContent="Server nicht erreichbar"}}
ctl();zahlDraw();load();setInterval(()=>{if(OFFEN.has("zahl")&&Date.now()-ZA.t>120000)ladeZahl()},30000);
</script></body></html>
