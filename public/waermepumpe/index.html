function dmhm(t){return dm(t)+" "+hm(t)}

function loc(t){var d=dt(t),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())}
function sub(rows,a,b){return rows.filter(function(r){return r[0]>=a&&r[0]<=b})}
function step(rs,i){return i+1<rs.length?Math.min(rs[i+1][0]-rs[i][0],60):0}
var EX={wmz_hz:3,wmz_bw:4,betr_h:5,starts:6};
function col(k){return k in EX?EX[k]+TN.length:1+TN.indexOf(k)}
function flag(r,k){return (r[1+TN.length]>>BN.indexOf(k))&1}
function modus(r,P){return P.modi[r[2+TN.length]]}
function counter(rs,c){var v=rs.map(function(r){return r[c]}).filter(function(x){return x!=null});if(v.length<2)return null;var s=0,st=v[0],pr=v[0];for(var i=1;i<v.length;i++){if(v[i]<pr-1){s+=pr-st;st=v[i]}pr=v[i]}return s+pr-st}
function phasen(rs,fn){var out=[],st=null,last=null,prev=null;rs.forEach(function(r){var gap=prev!=null&&r[0]-prev>300;if(st!=null&&(!fn(r)||gap)){out.push([st,last]);st=null}if(fn(r)){if(st==null)st=r[0];last=r[0]}prev=r[0]});if(st!=null)out.push([st,last]);return out}
function diagramm(rs,ser,t0,t1,o){o=o||{};
  var W=900,H=260,L=44,R=12,T=10,B=28;
  if(rs.length<2||t1<=t0)return"<p class='m'>Keine Daten im Zeitraum.</p>";
  var n=900,k=Math.ceil(rs.length/n),pts=[];
  for(var i=0;i<rs.length;i+=k){var blk=rs.slice(i,i+k),e={t:blk.reduce(function(a,r){return a+r[0]},0)/blk.length};
    ser.forEach(function(s){var c=col(s[0]),vs=blk.map(function(r){return r[c]}).filter(function(x){return x!=null});e[s[0]]=vs.length?vs.reduce(function(a,b){return a+b},0)/vs.length:null});pts.push(e)}
  var all=[];pts.forEach(function(p){ser.forEach(function(s){if(p[s[0]]!=null)all.push(p[s[0]])})});
  if(!all.length)return"<p class='m'>Keine Werte im Zeitraum.</p>";
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=Math.max(1,(hi-lo)*.08);lo-=pad;hi+=pad;var bars=o.bars||[];if(bars.length){lo=Math.min(lo,0);hi=Math.max(hi,BAR+1)}
  var x=function(t){return L+(t-t0)/(t1-t0)*(W-L-R)},y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">',sy=hi-lo>30?5:hi-lo>10?2:1;
  for(var v=Math.ceil(lo/sy)*sy;v<hi;v+=sy)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" class="g"/><text x="'+(L-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" class="a">'+v+'</text>';
  var lang=t1-t0>36*3600;
  for(var i=0;i<=6;i++){var t=t0+(t1-t0)*i/6;s+='<text x="'+x(t).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i==6?"end":i==0?"start":"middle")+'" class="a">'+(lang?dmhm(t):hm(t))+'</text>'}
  var gap=Math.max(300,3*(t1-t0)/n);
  bars.forEach(function(bd,li0){var n=o.single?1:bars.length,li=o.single?0:li0,ya=y(li*BAR/n),yb=y((li+1)*BAR/n);phasen(bd.rows||rs,bd.fn).forEach(function(p){var xa=x(Math.max(p[0],t0)),xb=x(Math.min(p[1]+10,t1));s+='<rect x="'+xa.toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+Math.max(1.5,xb-xa).toFixed(1)+'" height="'+(ya-yb).toFixed(1)+'" fill="var('+bd.c+')" opacity=".6"/>'})});
  ser.forEach(function(sr){var d="",last=null;pts.forEach(function(p){var v=p[sr[0]];if(v==null)return;d+=(last==null||p.t-last>gap?"M":"L")+x(p.t).toFixed(1)+","+y(v).toFixed(1);last=p.t});
    if(d)s+='<path d="'+d+'" fill="none" stroke="var('+sr[2]+')" stroke-width="1.6"'+(sr[0]=="rl_soll"?' stroke-dasharray="5 4"':"")+'/>'});
  return s+"</svg>"}
function cop(w,e){return e>=1?w/e:null}
function stromAbschnitt(a,b,gesamtKwh){
  var S=DATA.strom,h="<section><h2>Strom und COP</h2>";
  if(!S||!Object.keys(S).length)return h+"<p class='m'>Waermemenge beider Pumpen im Zeitraum: <b>"+f1(gesamtKwh)+" kWh</b>. Es liegt keine Strom-Verlaufsdatei vor (waermepumpen_strom.py --intervall 15 schreibt sie).</p></section>";
  var names=Object.keys(S),tw=0,te=0,ok=0,z="";
  h+="<div class='tw'><table><tr><th></th><th>Waerme [kWh]</th><th>Strom [kWh]</th><th>COP</th><th>Heizung COP</th><th>Warmwasser COP</th><th>Heizstab Strom [kWh]</th><th>Messpunkte</th></tr>";
  names.forEach(function(n){var rs=sub(S[n],a,b);
    if(rs.length<2){h+="<tr><td>"+n+"</td><td colspan=7 style='text-align:left'>zu wenig Messpunkte im Zeitraum</td></tr>";return}
    var w=counter(rs,3),e=counter(rs,6),wh=counter(rs,1),eh=counter(rs,4),ww=counter(rs,2),ew=counter(rs,5);
    tw+=w||0;te+=e||0;ok++;
    h+="<tr><td>"+n+"</td><td>"+f1(w)+"</td><td>"+f1(e)+"</td><td><b>"+f1(cop(w,e),2)+"</b></td><td>"+f1(eh>=1?wh/eh:null,2)+"</td><td>"+f1(ew>=1?ww/ew:null,2)+"</td><td>"+f1(counter(rs,9),1)+"</td><td>"+rs.length+"</td></tr>"});
  if(ok==names.length&&ok>1)h+="<tr><td><b>Beide</b></td><td><b>"+f1(tw)+"</b></td><td><b>"+f1(te)+"</b></td><td><b>"+f1(cop(tw,te),2)+"</b></td><td></td><td></td><td></td><td></td></tr>";
  h+="</table></div><p class='m'>COP = Waermemenge / eingesetzte Energie aus den Zaehlerstaenden der Weboberflaeche (ohne Heizstab). Der Zeitraum beginnt und endet am ersten und letzten Messpunkt, der Abstand der Messpunkte betraegt typisch 15 Minuten.</p>";
  var tage={},ord=[];
  names.forEach(function(n){var rs=sub(S[n],a,b),prev=null;rs.forEach(function(r){var d=dt(r[0]),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(!tage[k]){tage[k]={};ord.push(k)}var g=tage[k][n]=tage[k][n]||(prev?[prev]:[]);g.push(r);prev=r})});
  ord=ord.filter(function(k,i){return ord.indexOf(k)==i}).sort();
  if(ord.length>1){h+="<h3>COP je Tag</h3><div class='tw' style='max-height:360px;overflow:auto'><table><tr><th>Tag</th><th>Waerme [kWh]</th><th>Strom [kWh]</th><th>COP</th><th>Ø Aussen [°C]</th></tr>";
    ord.forEach(function(k){var w=0,e=0,n2=0,au=[];names.forEach(function(n){var g=tage[k][n];if(!g||g.length<2)return;n2++;w+=counter(g,3)||0;e+=counter(g,6)||0;g.forEach(function(r){if(r[7]!=null)au.push(r[7])})});
      if(n2==names.length&&e>=1)h+="<tr><td>"+k.slice(8)+"."+k.slice(5,7)+"."+k.slice(0,4)+"</td><td>"+f1(w)+"</td><td>"+f1(e)+"</td><td><b>"+f1(w/e,2)+"</b></td><td>"+f1(au.length?au.reduce(function(p,q){return p+q},0)/au.length:null)+"</td></tr>"});
    h+="</table></div>"}
  return h+"</section>"}
function render(){
  var a=WIN[0],b=WIN[1];
  $("hin").textContent="Zeitraum: "+dmhm(a)+" bis "+dmhm(b)+" ("+std((b-a)/3600)+")";
  $("btns").innerHTML=BTN.map(function(x){return'<button type="button" data-h="'+x[0]+'" class="'+(x[0]==SEL?"on":"")+'">'+x[1]+"</button>"}).join("");
  document.querySelectorAll("#btns button").forEach(function(el){el.onclick=function(){var h=+el.dataset.h;SEL=h;WIN=h?[Math.max(DATA.t0,DATA.t1-h*3600),DATA.t1]:[DATA.t0,DATA.t1];$("err").textContent="";render()}});
  $("von").value=loc(a);$("bis").value=loc(b);
  var o="",gesamtKwh=0;
  Object.keys(DATA.pumpen).forEach(function(name){
    var P=DATA.pumpen[name],rs=sub(P.rows,a,b),ser=P.serien;
    o+="<section><h2>"+name+"</h2>";
    if(rs.length<2){o+="<p class='m'>Keine Messdaten in diesem Zeitraum.</p></section>";return}
    var hz=function(r){return flag(r,"vd")&&/heiz|heating/i.test(modus(r,P)||"")},ww=function(r){return flag(r,"vd")&&/warm|hot/i.test(modus(r,P)||"")};
    var S2=DATA.pumpen.Slave,r2=S2?sub(S2.rows,a,b):[],hz2=function(r){return flag(r,"vd")&&/heiz|heating/i.test(modus(r,S2)||"")};
    var bs=name=="Slave"?[{fn:ww,c:"--wb"}]:[{fn:hz,c:"--hz"}].concat(S2?[{rows:r2,fn:hz2,c:"--h2"}]:[]);
    var lg=name=="Slave"?'<span><i style="background:var(--wb);height:8px"></i>Pumpe 2 Warmwasser läuft (Balken bis '+BAR+')</span>':'<span><i style="background:var(--hz);height:8px"></i>Pumpe 1 Heizung läuft</span><span><i style="background:var(--h2);height:8px"></i>Pumpe 2 Heizung läuft</span><span>(Balken bis '+BAR+', oben Pumpe 2)</span>';
    o+=diagramm(rs,ser,a,b,{bars:bs})+'<div class="leg">'+ser.map(function(s){return'<span><i style="background:var('+s[2]+')"></i>'+s[1]+"</span>"}).join("")+lg+"</div>";
    if(name=="Master")o+='<h3>Heizung</h3>'+diagramm(rs,[["rl_ext","Rücklauf extern","--c3"],["rl_soll","Rücklauf Soll","--c5"]],a,b,{bars:bs})+'<div class="leg"><span><i style="background:var(--c3)"></i>Rücklauf extern</span><span><i style="background:var(--c5)"></i>Rücklauf Soll (gestrichelt)</span><span><i style="background:var(--hz);height:8px"></i>Pumpe 1 Heizung läuft</span><span><i style="background:var(--h2);height:8px"></i>Pumpe 2 Heizung läuft</span><span>(Balken bis '+BAR+', oben Pumpe 2)</span></div>';
    if(ser.some(function(s){return s[0]=="ww"}))o+='<h3>Warmwasser</h3>'+diagramm(rs,[["ww","Warmwasser Ist","--c3"]],a,b,{bars:[{fn:ww,c:"--wb"}]})+'<div class="leg"><span><i style="background:var(--c3)"></i>Warmwasser Ist</span><span><i style="background:var(--wb);height:8px"></i>Warmwasserbereitung läuft (Balken bis '+BAR+')</span></div>';
    o+='<p class="m">'+rs.length+" Messungen</p><h3>Temperaturen [°C]</h3><div class='tw'><table><tr><th></th><th>min</th><th>Mittel</th><th>max</th></tr>";
    DATA.tempnamen.forEach(function(nm,i){var c=1+i,vs=rs.map(function(r){return r[c]}).filter(function(x){return x!=null});if(!vs.length)return;
      var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),mi=vs.reduce(function(p,q){return p+q},0)/vs.length;
      o+="<tr><td>"+nm+(vs.length>10&&mn==mx?" (konstant)":"")+"</td><td>"+f1(mn)+"</td><td>"+f1(mi)+"</td><td>"+f1(mx)+"</td></tr>"});
    o+="</table></div>";
    var tot=0;rs.forEach(function(r,i){tot+=step(rs,i)});
    var sp=rs.filter(function(r){return flag(r,"vd")&&r[col("vl")]!=null&&r[col("rl")]!=null}).map(function(r){return r[col("vl")]-r[col("rl")]});
    if(sp.length)o+='<p class="m">Spreizung VL-RL bei laufendem Verdichter: Ø '+f1(sp.reduce(function(p,q){return p+q},0)/sp.length)+" K, max "+f1(Math.max.apply(null,sp))+" K</p>";
    o+="<h3>Betrieb</h3><div class='tw'><table><tr><th></th><th>Anteil</th><th>Dauer</th></tr>";
    BN.forEach(function(k){var s=0;rs.forEach(function(r,i){if(flag(r,k))s+=step(rs,i)});o+="<tr><td>"+BNAME[k]+"</td><td>"+f1(tot?s/tot*100:0)+" %</td><td>"+std(s/3600)+"</td></tr>"});
    var md={};rs.forEach(function(r,i){var m=modus(r,P)||"?";md[m]=(md[m]||0)+step(rs,i)});
    o+="</table></div><p class='m'>Betriebsarten: "+Object.keys(md).sort(function(p,q){return md[q]-md[p]}).map(function(m){return m+" "+std(md[m]/3600)}).join(", ")+"</p>";
    var la=phasen(rs,function(r){return flag(r,"vd")});
    if(la.length){var dd=la.map(function(p){return(p[1]-p[0])/60}),kurz=dd.filter(function(d){return d<10}).length;
      o+="<h3>Verdichterlaeufe ("+la.length+", Ø "+f1(dd.reduce(function(p,q){return p+q},0)/dd.length,0)+" min, kuerzester "+f1(Math.min.apply(null,dd),0)+", laengster "+f1(Math.max.apply(null,dd),0)+" min, kurze unter 10 min: "+kurz+")</h3><div class='tw' style='max-height:320px;overflow:auto'><table><tr><th>Start</th><th>Ende</th><th>Minuten</th><th>Betriebsart</th></tr>";
      la.forEach(function(p){var c={};rs.forEach(function(r){if(r[0]>=p[0]&&r[0]<=p[1]){var m=modus(r,P);c[m]=(c[m]||0)+1}});var mm=Object.keys(c).sort(function(u,v){return c[v]-c[u]})[0]||"";
        o+="<tr><td>"+dmhm(p[0])+"</td><td>"+hm(p[1])+"</td><td>"+f1((p[1]-p[0])/60,0)+"</td><td>"+mm+"</td></tr>"});
      o+="</table></div>"}else o+="<h3>Verdichterlaeufe</h3><p class='m'>keine</p>";
    var ab=phasen(rs,function(r){return flag(r,"av")});
    if(ab.length){o+="<h3>Abtauungen ("+ab.length+", Ø "+f1(ab.reduce(function(s,p){return s+(p[1]-p[0])/60},0)/ab.length)+" min)</h3><div class='tw' style='max-height:240px;overflow:auto'><table><tr><th>Start</th><th>Minuten</th></tr>"+ab.map(function(p){return"<tr><td>"+dmhm(p[0])+"</td><td>"+f1((p[1]-p[0])/60)+"</td></tr>"}).join("")+"</table></div>"}
    else o+="<h3>Abtauungen</h3><p class='m'>keine</p>";
    var hz=counter(rs,col("wmz_hz")),bw=counter(rs,col("wmz_bw")),bh=counter(rs,col("betr_h")),st=counter(rs,col("starts"));
    gesamtKwh+=(hz||0)+(bw||0);
    o+="<h3>Zaehler im Zeitraum</h3><p class='m'>Waermemenge Heizung "+f1(hz)+" kWh, Warmwasser "+f1(bw)+" kWh. Betriebsstunden Verdichter "+f1(bh)+" h, Starts "+f1(st,0)+".</p>";
    var tage={};rs.forEach(function(r){var d=dt(r[0]),k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();(tage[k]=tage[k]||[]).push(r)});
    var ks=Object.keys(tage);
    if(ks.length>1){o+="<h3>Je Tag</h3><div class='tw'><table><tr><th>Tag</th><th>Verdichter [h]</th><th>Heizung kWh</th><th>Warmwasser kWh</th><th>Ø Aussen °C</th><th>Abtauungen</th></tr>";
      ks.forEach(function(k){var t=tage[k],v=0,au=[];t.forEach(function(r,i){if(flag(r,"vd"))v+=step(t,i);if(r[col("aussen")]!=null)au.push(r[col("aussen")])});
        var n=phasen(t,function(r){return flag(r,"av")}).length;
        o+="<tr><td>"+dt(t[0][0]).toLocaleDateString("de-DE")+"</td><td>"+f1(v/3600)+"</td><td>"+f1(counter(t,col("wmz_hz")))+"</td><td>"+f1(counter(t,col("wmz_bw")))+"</td><td>"+f1(au.length?au.reduce(function(p,q){return p+q},0)/au.length:null)+"</td><td>"+n+"</td></tr>"});
      o+="</table></div>"}
    o+="</section>"});
  o+=stromAbschnitt(a,b,gesamtKwh);
  $("pumpen").innerHTML=o}
function setBar(v){BAR=v;$("b10").className=v==10?"on":"";$("b25").className=v==25?"on":"";render()}
$("b10").onclick=function(){setBar(10)};$("b25").onclick=function(){setBar(25)};
$("go").onclick=function(){var a=$("von").value,b=$("bis").value;
  if(!a||!b){$("err").textContent=" Bitte Beginn und Ende waehlen.";return}
  var t0=new Date(a).getTime()/1000,t1=new Date(b).getTime()/1000;
  if(!(t1>t0)){$("err").textContent=" Das Ende muss nach dem Beginn liegen.";return}
  $("err").textContent="";SEL=-1;WIN=[t0,t1];render()};
$("info").textContent=DATA.info;
render();
</script></body></html>
